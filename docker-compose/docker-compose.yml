version: '3.7'

services:
  opa:
    image: ${OPENPOLICYAGENT_DOCKER_IMAGE:-docker.io/openpolicyagent/opa:1.19.0-debug@sha256:ec3c7a29a21ce96d71231cb4befa2561205fe84e5a2dc3cc46ac7bc8bd21b3a4}
    ports:
      - "8181:8181"
    # WARNING: OPA is NOT running with an authorization policy configured. This
    # means that clients can read and write policies in OPA. If you are
    # deploying OPA in an insecure environment, be sure to configure
    # authentication and authorization on the daemon. See the Security page for
    # details: https://www.openpolicyagent.org/docs/security.html.
    command:
      - "run"
      - "--server"
      - "--log-format=json-pretty"
      - "--set=decision_logs.console=true"
      - "file:/config/example.rego"
    volumes:
      - "./example-rego/example.rego:/config/example.rego"

  gateway:
    image: ${CONTENTGRID_GATEWAY_DOCKER_IMAGE:-ghcr.io/xenit-eu/contentgrid-gateway:local}
    volumes:
      - ./example-gateway:/config
    environment:
      - "SPRING_CONFIG_IMPORT=file:/config/application.yml"
#      - "JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:8000"
    ports:
      - "8080:8080"
#      - "8000:8000"

  upstream:
    image: nginx@sha256:05b8cb60c354a44ab824ea6e7dc69b46d50762cdbe728a347a5b656e6fb3d7c4